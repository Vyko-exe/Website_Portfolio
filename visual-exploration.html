  <!-- REORDER BAR -->
  <div id="reorder-bar" style="display: none; position: fixed; bottom: 0px; left: 0px; right: 0px; z-index: 500; background: rgba(20, 20, 20, 0.97); border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 56px; align-items: center; justify-content: space-between; gap: 16px;">
    <span style="font-size:.48rem;letter-spacing:.25em;text-transform:uppercase;color:#a0a0a0">Mode réorganisation — glisse les images</span>
    <div style="display:flex;gap:10px">
      <button id="reorder-save" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);color:#e8e8e8;padding:6px 16px;font-size:.44rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer">Sauvegarder (télécharger)</button>
      <button id="reorder-exit" style="background:none;border:1px solid rgba(255,255,255,.2);color:#e8e8e8;padding:6px 16px;font-size:.44rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer">Quitter</button>
    </div>
  </div>

  <script src="media.js"></script>
  <script>
    // ── REORDER MODE ─────────────────────────────────────────────────────────
    let reorderActive = false;
    let dragSrc = null;
    let didDrag = false;
    const reorderBar = document.getElementById('reorder-bar');

    // SECRET TRIGGER : 5 clics rapides sur le titre de la page
    let titleClicks = 0, titleTimer;
    document.querySelector('.page-title').addEventListener('click', () => {
      titleClicks++;
      clearTimeout(titleTimer);
      titleTimer = setTimeout(() => { titleClicks = 0; }, 1500);
      if (titleClicks >= 5) { titleClicks = 0; reorderActive ? exitReorder() : enterReorder(); }
    });

    function enterReorder() {
      reorderActive = true;
      reorderBar.style.display = 'flex';
      document.body.style.paddingBottom = '60px';
      document.querySelectorAll('.thumb').forEach(t => {
        t.draggable = true;
        t.style.cursor = 'grab';
        t.style.outline = '1px dashed rgba(255,255,255,.25)';
        t.addEventListener('dragstart', onDragStart);
        t.addEventListener('dragover',  onDragOver);
        t.addEventListener('drop',      onDrop);
        t.addEventListener('dragend',   onDragEnd);
      });
    }

    function exitReorder() {
      reorderActive = false;
      reorderBar.style.display = 'none';
      document.body.style.paddingBottom = '';
      document.querySelectorAll('.thumb').forEach(t => {
        t.draggable = false;
        t.style.cursor = '';
        t.style.outline = '';
        t.removeEventListener('dragstart', onDragStart);
        t.removeEventListener('dragover',  onDragOver);
        t.removeEventListener('drop',      onDrop);
        t.removeEventListener('dragend',   onDragEnd);
      });
    }

    function onDragStart(e) { dragSrc = this; didDrag = false; this.style.opacity = '.4'; }
    function onDragEnd()    { this.style.opacity = ''; didDrag = true; setTimeout(() => { didDrag = false; }, 100); document.querySelectorAll('.thumb').forEach(t => t.style.outline = '1px dashed rgba(255,255,255,.25)'); }
    function onDragOver(e)  { e.preventDefault(); this.style.outline = '1px solid rgba(255,255,255,.7)'; }
    function onDrop(e) {
      e.preventDefault();
      if (dragSrc === this) return;
      const strip = this.parentNode;
      const srcIdx = [...strip.children].indexOf(dragSrc);
      const tgtIdx = [...strip.children].indexOf(this);
      if (srcIdx < tgtIdx) strip.insertBefore(dragSrc, this.nextSibling);
      else strip.insertBefore(dragSrc, this);
    }

    // ── SAVE ─────────────────────────────────────────────────────────────────
    function buildCleanHTML() {
      const clone = document.documentElement.cloneNode(true);
      clone.removeAttribute('data-theme');   // le mode nuit ne doit pas être figé dans le fichier sauvegardé
      clone.classList.remove('menu-open', 'leaving');
      clone.querySelectorAll('.page-meta').forEach(el => el.remove());   // ajouté par smooth.js, ne pas le figer
      clone.querySelectorAll('.thumb').forEach(t => {
        t.removeAttribute('draggable');
        t.style.cssText = '';
        const img = t.querySelector('.thumb-img');
        if (img) {
          const src = Media.src(img);
          if (src) { img.dataset.bg = src; img.removeAttribute('style'); img.removeAttribute('data-src'); }
        }
      });
      clone.querySelector('#reorder-bar').style.display = 'none';
      clone.querySelector('#title-panel').style.display = 'none';
      return '<!DOCTYPE html>\n' + clone.outerHTML;
    }

    function saveToFile() {
      const btn = document.getElementById('reorder-save');
      try {
        const blob = new Blob([buildCleanHTML()], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'visual-exploration.html';
        a.click();
        URL.revokeObjectURL(a.href);
        btn.textContent = 'Téléchargé !';
        setTimeout(() => btn.textContent = 'Sauvegarder (télécharger)', 2000);
      } catch(e) {
        btn.textContent = 'Erreur : ' + e.message;
        setTimeout(() => btn.textContent = 'Sauvegarder (télécharger)', 3000);
      }
    }

    document.getElementById('reorder-exit').addEventListener('click', exitReorder);
    document.getElementById('reorder-save').addEventListener('click', saveToFile);

    // ── INIT ──────────────────────────────────────────────────────────────────
    // Remove thumbs with no image
    document.querySelectorAll('.thumb').forEach(t => {
      const img = t.querySelector('.thumb-img');
      if (!img || (!img.dataset.bg && !img.style.backgroundImage)) t.remove();
    });

    // Lazy load background images
    const lazyObs = new IntersectionObserver(e => e.forEach(x => {
      if (x.isIntersecting) {
        const el = x.target;
        Media.bg(el);
        lazyObs.unobserve(el);
      }
    }), {rootMargin:'200px'});
    document.querySelectorAll('.thumb-img[data-bg]').forEach(el => lazyObs.observe(el));

    // Reveal on scroll
    const obs = new IntersectionObserver(e => e.forEach(x => { if(x.isIntersecting) x.target.classList.add('in') }), {threshold:.05});
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    // ── LIGHTBOX ─────────────────────────────────────────────────────────────
    const lb      = document.getElementById('lightbox');
    const lbCont  = document.getElementById('lb-content');
    const lbTitle = document.getElementById('lb-meta-title');
    const lbInfo  = document.getElementById('lb-meta-info');
    let current = 0;
    const all = () => [...document.querySelectorAll('.thumb')];

    function open(i) {
      const thumbs = all();
      if (!thumbs[i]) return;
      current = i;
      const t = thumbs[i];
      const imgEl = t.querySelector('.thumb-img');
      const src = Media.src(imgEl);
      lbTitle.textContent = t.dataset.title || '';
      lbInfo.textContent  = t.dataset.year || '';
      lbCont.innerHTML = '';
      if (src) {
        const img = document.createElement('img');
        img.id = 'lb-img';
        Media.img(img, src);
        img.onload = () => img.classList.add('loaded');
        lbCont.appendChild(img);
      } else {
        const box = document.createElement('div');
        box.className = 'lb-ph-box';
        const num = t.querySelector('.thumb-ph-num');
        box.innerHTML = '<span>'+(num?num.textContent:(i+1))+'</span>';
        lbCont.appendChild(box);
      }
      if (!lb.classList.contains('open')) history.pushState({lb:true}, '');
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      if (!lb.classList.contains('open')) return;
      lb.classList.remove('open');
      document.body.style.overflow = '';
      history.back();
    }

    window.addEventListener('popstate', () => {
      if (lb.classList.contains('open')) { lb.classList.remove('open'); document.body.style.overflow = ''; }
    });

    // ── TITLE EDIT PANEL ─────────────────────────────────────────────────────
    const titlePanel      = document.getElementById('title-panel');
    const titlePanelInput = document.getElementById('title-panel-input');
    let   titlePanelThumb = null;

    function openTitlePanel(thumb) {
      titlePanelThumb = thumb;
      titlePanelInput.value = thumb.dataset.title || '';
      titlePanel.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      setTimeout(() => titlePanelInput.focus(), 50);
    }

    function closeTitlePanel() {
      titlePanel.style.display = 'none';
      document.body.style.overflow = '';
      titlePanelThumb = null;
    }

    document.getElementById('title-panel-confirm').addEventListener('click', () => {
      if (!titlePanelThumb) return;
      const newTitle = titlePanelInput.value.trim();
      if (newTitle) {
        titlePanelThumb.dataset.title = newTitle;
        const label = titlePanelThumb.querySelector('.thumb-label');
        if (label) label.textContent = newTitle;
      }
      closeTitlePanel();
    });

    document.getElementById('title-panel-cancel').addEventListener('click', closeTitlePanel);

    titlePanelInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('title-panel-confirm').click();
      if (e.key === 'Escape') closeTitlePanel();
    });

    // ── LIGHTBOX + CLICK ─────────────────────────────────────────────────────
    all().forEach(t => t.addEventListener('click', () => {
      if (reorderActive) { if (!didDrag) openTitlePanel(t); }
      else open(all().indexOf(t));
    }));
    document.getElementById('lb-close').addEventListener('click', close);
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); const n=all().length; open((current-1+n)%n); });
    document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); open((current+1)%all().length); });
    Media.swipe(lb, () => open((current-1+all().length)%all().length), () => open((current+1)%all().length));
    document.addEventListener('keydown', e => {
      if (titlePanel.style.display !== 'none') return;
      if (!lb.classList.contains('open')) return;
      if (e.key==='Escape') close();
      if (e.key==='ArrowLeft')  { const n=all().length; open((current-1+n)%n); }
      if (e.key==='ArrowRight') open((current+1)%all().length);
    });
    </script>
