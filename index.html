  <script>
    // Intro : fond blanc, l'illustration est "peinte" au pinceau quand on survole le bouton,
    // clic = entrer (une seule fois par session)
    (function () {
      const intro = document.getElementById('intro');
      const btn = document.getElementById('intro-btn');
      let seen = false;
      try { seen = sessionStorage.getItem('introSeen') === '1'; } catch (e) {}
      if (seen) { intro.remove(); return; }
      document.body.style.overflow = 'hidden';

      const paint = createPaint(document.getElementById('intro-paint'), 'images/Digital2d/2026/Lia.jpg');

      // survol souris, focus clavier ou (écrans tactiles) déclenchement automatique
      let hover = false, focused = false, auto = false, shown = false;
      function update() {
        const want = hover || focused || auto;
        if (want === shown) return;
        shown = want;
        intro.classList.toggle('reveal-bg', want);
        want ? paint.start() : paint.stop();
      }
      btn.addEventListener('mouseenter', () => { hover = true; update(); });
      btn.addEventListener('mouseleave', () => { hover = false; update(); });
      btn.addEventListener('focus', () => { focused = true; update(); });
      btn.addEventListener('blur', () => { focused = false; update(); });
      if (window.matchMedia('(hover: none)').matches) setTimeout(() => { auto = true; update(); }, 700);

      btn.addEventListener('click', () => {
        try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}
        intro.classList.add('out');
        document.body.style.overflow = '';
        setTimeout(() => { paint.destroy(); intro.remove(); }, 1000);
      });
    })();


    // Effet "peinture" : l'image est révélée par une suite de coups de pinceau tous différents
    // (angle, longueur, largeur, courbure, pression, pinceau sec ou chargé). Le plan est tiré au hasard
    // à chaque survol : chaque coup vise une zone encore vide, près de la peinture existante, jusqu'à
    // couvrir l'écran. Chaque coup est une brosse de poils (dessinés avec l'image comme motif).
    // Au départ de la souris le tout s'efface en fondu (CSS) puis repart d'une toile vierge.
    function createPaint(canvas, src) {
      const ctx = canvas.getContext('2d');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const img = new Image();
      let ready = false, wanted = false;
      let W = 0, H = 0, dpr = 1, cover = null, pattern = null;
      let strokes = [], clock = 0, endTime = 0, phase = 'idle'; // idle | paint | settle | done
      let settleFrames = 0, raf = 0, last = 0, resetTimer = 0, resizeTimer = 0;

      const NB = 8;                       // classes d'épaisseur de poils (un seul stroke() par classe et par frame)
      const BW = [];                      // épaisseur de chaque classe, en px canvas

      const rand = (a, b) => a + Math.random() * (b - a);
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
      // bruit déterministe : les "trous" du pinceau sec ne changent pas d'une frame à l'autre
      const hash = (a, b) => {
        let h = (a ^ Math.imul(b, 0x9e3779b1)) | 0;
        h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
        h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      };
      const EASES = [
        x => 1 - Math.pow(1 - x, 3),      // geste vif qui freine
        x => x * x * (3 - 2 * x),         // geste souple
        x => 1 - Math.pow(1 - x, 1.6)
      ];

      // Image recadrée "cover" à la taille de l'écran, couleurs d'origine (sert de motif au pinceau)
      function layout() {
        const cw = canvas.clientWidth || innerWidth, ch = canvas.clientHeight || innerHeight;
        // au plus ~3 millions de pixels (fluidité) : net sur téléphone, un peu allégé sur les grands écrans Retina
        dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3e6 / (cw * ch)));
        W = canvas.width = Math.round(cw * dpr);
        H = canvas.height = Math.round(ch * dpr);
        for (let i = 0; i < NB; i++) BW[i] = (1 + 2 * i) * dpr;
        cover = document.createElement('canvas');
        cover.width = W; cover.height = H;
        const c = cover.getContext('2d');
        const k = Math.max(W / img.naturalWidth, H / img.naturalHeight);
        const w = img.naturalWidth * k, h = img.naturalHeight * k;
        c.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        pattern = ctx.createPattern(cover, 'no-repeat');
        reset();
      }

      // Courbe de Bézier rééchantillonnée à pas constant (+ normales) pour placer les poils
      function sampleCurve(p, spacing) {
        const N = 300, pts = [], cum = [0];
        for (let i = 0; i <= N; i++) {
          const t = i / N, u = 1 - t;
          const x = u*u*u*p[0] + 3*u*u*t*p[2] + 3*u*t*t*p[4] + t*t*t*p[6];
          const y = u*u*u*p[1] + 3*u*u*t*p[3] + 3*u*t*t*p[5] + t*t*t*p[7];
          pts.push([x, y]);
          if (i) cum.push(cum[i - 1] + Math.hypot(x - pts[i - 1][0], y - pts[i - 1][1]));
        }
        const count = Math.max(8, Math.round(cum[N] / spacing));
        const xs = [], ys = [], nx = [], ny = [];
        let i = 0;
        for (let j = 0; j <= count; j++) {
          const target = cum[N] * j / count;
          while (i < N - 1 && cum[i + 1] < target) i++;
          const f = (target - cum[i]) / ((cum[i + 1] - cum[i]) || 1);
          xs.push(pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f);
          ys.push(pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f);
        }
        for (let j = 0; j <= count; j++) {
          const a = Math.max(0, j - 1), b = Math.min(count, j + 1);
          const tx = xs[b] - xs[a], ty = ys[b] - ys[a], l = Math.hypot(tx, ty) || 1;
          nx.push(-ty / l); ny.push(tx / l);
        }
        return { xs, ys, nx, ny, count };
      }

      // ── PLAN : une suite aléatoire de coups qui finit par couvrir tout l'écran ──────────────────
      function plan() {
        const cell = 16 * dpr;
        const gw = Math.ceil(W / cell), gh = Math.ceil(H / cell), total = gw * gh;
        const cov = new Uint8Array(total), mark = new Int32Array(total);
        let left = total, markId = 0;
        const minDim = Math.min(W, H), diag = Math.hypot(W, H);
        const main = rand(-0.85, 0.85) + (Math.random() < 0.25 ? Math.PI / 2 : 0);   // sens dominant de la séance
        const trail = [];                                                              // points déjà peints
        const found = [];

        const bez = (p, t) => {
          const u = 1 - t;
          return [u*u*u*p[0] + 3*u*u*t*p[2] + 3*u*t*t*p[4] + t*t*t*p[6],
                  u*u*u*p[1] + 3*u*u*t*p[3] + 3*u*t*t*p[5] + t*t*t*p[7]];
        };

        // cases touchées par un coup ; apply=false : on compte seulement les cases encore vides
        function footprint(p, w, dry, apply) {
          const chord = Math.hypot(p[6] - p[0], p[7] - p[1]);
          const steps = Math.max(6, Math.ceil(chord * 1.15 / (cell * 0.8)));
          const tMax = 1 - 0.28 * dry;                 // un pinceau sec s'arrête plus tôt
          let gain = 0;
          markId++;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            if (t > tMax) break;
            const q = bez(p, t);
            const r = w * 0.3 / cell * (1 - 0.3 * dry) * (0.3 + 0.7 * Math.min(1, t * 6, (tMax - t) / 0.3));
            const cx = q[0] / cell, cy = q[1] / cell;
            const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(gw - 1, Math.ceil(cx + r));
            const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(gh - 1, Math.ceil(cy + r));
            for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) {
              const dx = xx + 0.5 - cx, dy = yy + 0.5 - cy;
              if (dx * dx + dy * dy > r * r) continue;
              const id = yy * gw + xx;
              if (mark[id] === markId) continue;
              mark[id] = markId;
              if (!cov[id]) { gain++; if (apply) { cov[id] = 1; left--; } }
            }
          }
          return gain;
        }

        // une case vide, choisie près d'un point de peinture existant (la peinture s'étend en tache)
        function pickTarget() {
          if (!found.length) return [W * rand(0.42, 0.58), H * rand(0.42, 0.58)];
          const un = [];
          for (let i = 0; i < total; i++) if (!cov[i]) un.push(i);
          const a = trail[(Math.random() * trail.length) | 0];
          let bx = 0, by = 0, bd = Infinity;
          for (let i = 0; i < 16; i++) {
            const id = un[(Math.random() * un.length) | 0];
            const x = ((id % gw) + 0.5) * cell, y = (((id / gw) | 0) + 0.5) * cell;
            const d = (x - a[0]) * (x - a[0]) + (y - a[1]) * (y - a[1]);
            if (d < bd) { bd = d; bx = x; by = y; }
          }
          return [bx, by];
        }

        function candidate(t, wBase) {
          const cross = Math.random() < 0.22;
          const ang = main + (cross ? Math.PI / 2 + rand(-0.5, 0.5) : rand(-0.35, 0.35));
          const w = wBase * rand(0.8, 1.25);
          const L = Math.min(diag * 0.7, w * rand(2.5, 5.5));
          const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
          const at = rand(0.2, 0.8);
          const ax = t[0] - dx * L * at, ay = t[1] - dy * L * at;
          const bx = ax + dx * L, by = ay + dy * L;
          const bend = L * rand(-0.07, 0.07), k1 = rand(0.6, 1.1), k2 = rand(0.2, 1.0);
          return {
            w, L,
            dry: Math.random() < 0.25 ? rand(0.4, 0.8) : rand(0, 0.25),               // pinceau sec ou chargé
            p: [ax, ay,
                ax + (bx - ax) * 0.33 + nx * bend * k1, ay + (by - ay) * 0.33 + ny * bend * k1,
                ax + (bx - ax) * 0.66 + nx * bend * k2, ay + (by - ay) * 0.66 + ny * bend * k2,
                bx, by]
          };
        }

        for (let guard = 0; left / total > 0.0015 && found.length < 170 && guard < 420; guard++) {
          const cover = 1 - left / total;
          const wBase = minDim * (0.19 - 0.13 * Math.pow(cover, 1.2));     // gros pinceau d'abord, puis plus fin
          const target = pickTarget();
          let best = null, bestScore = 0;
          for (let c = 0; c < 10; c++) {
            const cand = candidate(target, wBase);
            const score = footprint(cand.p, cand.w, cand.dry, false) * rand(0.8, 1.2);
            if (score > bestScore) { bestScore = score; best = cand; }
          }
          if (!best || footprint(best.p, best.w, best.dry, false) < 2) continue;
          footprint(best.p, best.w, best.dry, true);
          if (Math.random() < 0.5) {                                       // sens du geste au hasard
            const p = best.p;
            best.p = [p[6], p[7], p[4], p[5], p[2], p[3], p[0], p[1]];
          }
          for (let i = 0; i <= 8; i++) trail.push(bez(best.p, i / 8));
          found.push(best);
        }
        return found;
      }

      // ── un coup de pinceau : brosse plate, poils plus ou moins chargés ────────────────────────
      // Seule la silhouette se voit (l'image sert de peinture) : ce sont donc les bords effilochés,
      // les stries sèches à l'intérieur et la fin en peigne qui font "pinceau".
      function makeStroke(c, wMax) {
        const s = sampleCurve(c.p, 8 * dpr);
        s.w = c.w;
        s.dry = c.dry;
        s.ease = EASES[(Math.random() * EASES.length) | 0];
        s.finished = false;
        s.gapFactor = 0.025 + 0.12 * (c.w / wMax);
        s.dur = c.L / (rand(1800, 3000) * dpr);
        // pression : attaque franche (brosse posée à plat), fin un peu plus étroite
        const rin = rand(0.05, 0.12), rout = rand(0.25, 0.45), tip = rand(0.6, 0.85), wf = rand(2, 5), wph = rand(0, 6.28);
        s.prof = [];
        for (let k = 0; k <= s.count; k++) {
          const u = k / s.count;
          s.prof.push((u < rin ? 0.7 + 0.3 * smooth(u / rin) : 1)
            * (u > 1 - rout ? 1 - (1 - tip) * smooth((u - (1 - rout)) / rout) : 1)
            * (1 + 0.05 * Math.sin(u * wf + wph)));
        }
        const B = clamp(Math.round(c.w / (3 * dpr)), 12, 48);
        const gap = c.w / B;
        const splay = rand(0, 0.12) * (0.5 + s.dry);          // les poils s'écartent un peu en fin de course
        const tilt = rand(-0.06, 0.06);                         // brosse tenue un peu de biais : départ en biseau
        s.bristles = [];
        for (let i = 0; i < B; i++) {
          const f = (i + 0.5) / B * 2 - 1, edge = Math.abs(f);
          const thin = Math.random() < 0.07 || (edge > 0.85 && Math.random() < 0.5);
          const lw = gap * (thin ? rand(0.4, 0.7) : rand(1.5, 2.4));
          // charge en peinture : plus le poil est sec, plus il casse tôt et longtemps
          const load = clamp(rand(0.55, 1.15) - s.dry * 0.45 - edge * 0.15, 0.15, 1);
          s.bristles.push({
            off: f * c.w / 2 + rand(-0.35, 0.35) * gap,
            f,
            bucket: clamp(Math.round((lw / dpr - 1) / 2), 0, NB - 1),
            start: Math.round(s.count * clamp(rand(0, 0.04) + edge * edge * rand(0.01, 0.07) + tilt * (f + 1), 0, 0.2)),
            stop: Math.round(s.count * (1 - rand(0, 0.06) - (1 - load) * rand(0.05, 0.4) - edge * edge * rand(0, 0.08))),
            dryAt: 0.35 + load * rand(0.35, 0.75),
            maxGap: rand(0.2, 0.65) * (0.5 + s.dry),
            nf: rand(4, 9),                                     // longueur des cassures (en pas)
            speed: rand(0.995, 1.005),
            seed: (Math.random() * 1e9) | 0,
            drawn: -1
          });
        }
        s.splay = splay;
        return s;
      }

      // bruit lissé le long d'un poil : des cassures longues, dans le sens du geste
      function vnoise(seed, x) {
        const i = Math.floor(x), t = x - i, a = hash(seed, i), b = hash(seed, i + 1);
        return a + (b - a) * t * t * (3 - 2 * t);
      }

      function makeStrokes() {
        const list = plan();
        let wMax = 1;
        for (const c of list) wMax = Math.max(wMax, c.w);
        const out = list.map(c => makeStroke(c, wMax));
        // départs échelonnés au hasard : les gros coups se suivent plus lentement que les retouches
        let t = 0;
        out.forEach((s, i) => {
          s.t0 = t;
          t += rand(0.4, 1.2) * s.gapFactor * (i < 3 ? 0.5 : 1);
        });
        const shrink = Math.min(1, 0.95 / Math.max(t, 0.01));
        endTime = 0;
        for (const s of out) { s.t0 *= shrink; endTime = Math.max(endTime, s.t0 + s.dur); }
        return out;
      }

      // ajoute la partie nouvelle d'un poil aux chemins de la frame (par classe d'épaisseur)
      function addBristle(s, b, upto, pat) {
        const from = Math.max(b.drawn, b.start);
        const pp = pat[b.bucket] || (pat[b.bucket] = new Path2D());
        let down = false;
        for (let k = from; k <= upto; k++) {
          const u = k / s.count;
          const dryness = u > b.dryAt ? Math.min(1, (u - b.dryAt) / 0.3) * b.maxGap : 0;
          if (dryness && vnoise(b.seed, k / b.nf) < dryness) { down = false; continue; }
          const o = b.off * s.prof[k] + b.f * s.splay * s.w * u * u;
          const x = s.xs[k] + s.nx[k] * o, y = s.ys[k] + s.ny[k] * o;
          if (down) pp.lineTo(x, y); else { pp.moveTo(x, y); down = true; }
        }
        b.drawn = upto;
      }

      function stepStrokes() {
        const pat = new Array(NB);
        for (const s of strokes) {
          if (s.finished || clock < s.t0) continue;
          const x = Math.min(1, (clock - s.t0) / s.dur);
          const e = s.ease(x);
          for (const b of s.bristles) {
            const upto = Math.min(b.stop, Math.floor(e * b.speed * s.count));
            if (upto > b.drawn) addBristle(s, b, upto, pat);
          }
          if (x >= 1) s.finished = true;
        }
        // l'illustration révélée par les poils (un seul stroke() par classe d'épaisseur)
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = pattern;
        ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
        for (let i = 0; i < NB; i++) if (pat[i]) { ctx.lineWidth = BW[i]; ctx.stroke(pat[i]); }
      }

      function frame(now) {
        raf = 0;
        const dt = Math.min(now - last, 50);
        last = now;
        if (phase === 'paint') {
          clock += dt / 1000;
          stepStrokes();
          if (clock >= endTime) {
            phase = 'settle'; settleFrames = 0;
          }
        } else if (phase === 'settle') {
          // les derniers trous entre les coups de pinceau se comblent en douceur
          const final = ++settleFrames >= 14;
          ctx.globalCompositeOperation = 'destination-over';
          ctx.globalAlpha = final ? 1 : 0.18;
          ctx.drawImage(cover, 0, 0);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
          if (final) phase = 'done';
        }
        if (phase === 'paint' || phase === 'settle') kick();
      }

      function kick() {
        if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
      }

      function reset() {
        cancelAnimationFrame(raf); raf = 0;
        ctx.clearRect(0, 0, W, H);
        phase = 'idle'; clock = 0;
        strokes = reduced ? [] : makeStrokes();
      }

      function start() {
        wanted = true;
        clearTimeout(resetTimer);
        if (!ready) return;                       // démarrera dès que l'image est chargée
        if (phase === 'idle') {
          if (reduced) { ctx.drawImage(cover, 0, 0); phase = 'done'; return; }
          phase = 'paint';
        }
        kick();
      }

      function stop() {
        wanted = false;
        // on laisse le fondu CSS se terminer, puis on repart sur une toile vierge
        clearTimeout(resetTimer);
        resetTimer = setTimeout(reset, 900);
      }

      function onResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!ready) return;
          layout();
          if (wanted) start();
        }, 200);
      }

      function init() {
        ready = true;
        layout();
        window.addEventListener('resize', onResize);
        if (wanted) start();
      }

      img.src = src;
      (img.decode ? img.decode() : new Promise((ok, ko) => { img.onload = ok; img.onerror = ko; })).then(init).catch(() => {});

      return {
        start, stop,
        destroy() {
          cancelAnimationFrame(raf);
          clearTimeout(resetTimer); clearTimeout(resizeTimer);
          window.removeEventListener('resize', onResize);
        }
      };
    }

    // Home : au survol d'une catégorie du menu, ses images défilent en fond ; sinon, la dernière œuvre
    (function () {
      const D2 = 'images/Digital2d/2026/', D3E = 'images/Digital3d/2025/Eclipse/', D3G = 'images/Digital3d/2025/GuangJian Inspired sculpt/', TR = 'images/Traditional/';
      const CATS = {
        d2: [D2 + 'Odyssey.jpg', D2 + 'Red.jpg', D2 + 'Espina.jpg', D2 + 'PS01.jpg', D2 + 'Prairie.jpg', D2 + 'VonDutch.jpg'],
        d3: [D3E + '06.jpg', D3G + '01.png', D3E + '01.jpg', D3G + '03.png', D3E + '03.jpg', D3G + '05.png'],
        tr: [TR + '20260310_220524.jpg', TR + 'CCI15052026_0004.jpg', TR + 'CCI15052026_0002.jpg', TR + 'CCI15052026_0001.jpg', TR + 'CCI15052026_0003.jpg', TR + 'CCI15052026_0007.jpg']
      };
      const BASE = 'images/Digital2d/2026/Lia.jpg';
      const layers = document.querySelectorAll('#stage > img');
      const contact = document.querySelector('.stage-contact');
      const sign = document.querySelector('.s-sign');
      let front = 0, timer = 0, leaveTimer = 0, current = BASE;
      const preloaded = {};

      function show(src, fit) {
        if (src === current) return;
        current = src;
        const back = layers[1 - front];
        sign.style.setProperty('--sign-img', 'url("' + src + '")');   // la signature suit l'illustration
        back.classList.toggle('fit', !!fit);   // dessins en portrait : affichés en entier
        const swap = () => { back.classList.add('on'); layers[front].classList.remove('on'); front = 1 - front; };
        back.onload = null;
        if (back.getAttribute('src') === src && back.complete) swap();
        else { back.onload = swap; back.src = src; }
      }
      function enter(cat) {
        clearTimeout(leaveTimer); clearInterval(timer);
        contact.classList.toggle('on', cat === 'ct');   // Contact : l'email en grand
        if (cat === 'ct') return;
        const list = CATS[cat];
        if (!preloaded[cat]) { list.forEach(u => { new Image().src = u; }); preloaded[cat] = true; }
        let i = 0;
        const fit = cat === 'tr';
        show(list[0], fit);
        timer = setInterval(() => { i = (i + 1) % list.length; show(list[i], fit); }, 1800);
      }
      function leave() {
        clearInterval(timer);
        leaveTimer = setTimeout(() => { contact.classList.remove('on'); show(BASE); }, 150);
      }
      document.querySelectorAll('#side [data-cat]').forEach(a => {
        a.addEventListener('mouseenter', () => enter(a.dataset.cat));
        a.addEventListener('mouseleave', leave);
        a.addEventListener('focus', () => enter(a.dataset.cat));
        a.addEventListener('blur', leave);
      });
    })();
  </script>

</body>
</html>
